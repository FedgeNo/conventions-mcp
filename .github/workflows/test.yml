name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm test
      - run: npm run test:package
      # sharp currently has an upstream high-severity advisory with no released
      # fix. Keep reporting all findings, but only block releases on findings
      # that can meet the enforceable critical-severity policy.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
